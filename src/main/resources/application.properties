# ===============================================
# LABFLOW BACKEND CONFIGURATION
# ===============================================

# ===============================================
# DATABASE CONFIGURATION
# ===============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA/HIBERNATE CONFIGURATION
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================================
# FLYWAY CONFIGURATION
# ===============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===============================================
# SERVER CONFIGURATION
# ===============================================
server.port=${SERVER_PORT:8080}

# ===============================================
# SPRING BOOT DEVTOOLS
# ===============================================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**,public/**,META-INF/maven/**,META-INF/resources/**

# ===============================================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ===============================================
# ACTUATOR CONFIGURATION
# ===============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ===============================================
# LOGGING CONFIGURATION
# ===============================================
logging.level.com.labflow=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_LOG_LEVEL:DEBUG}