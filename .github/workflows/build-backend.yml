name: Build Backend

on:
  push:
    branches:
      - Produccion
      - develop
    paths:
      - 'labflow-backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - Produccion
      - develop
    paths:
      - 'labflow-backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/labflow-backend
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.8.4'

jobs:
  test:
    name: 🧪 Test & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labflow-backend
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Display Maven version
        run: mvn --version

      - name: Build application
        run: mvn clean verify -DskipTests

      - name: Run unit tests with coverage
        run: mvn test jacoco:report
        continue-on-error: false

      - name: Integration tests
        run: mvn verify -Dgroups=integration
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: labflow-backend/target/surefire-reports/**/*.xml
          check_name: Java Test Results

  security:
    name: 🔒 Security Scans
    uses: ./.github/workflows/security-scan.yml
    with:
      language: 'java'
      dockerfile_path: 'labflow-backend/Dockerfile'

  build:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: success()
    defaults:
      run:
        working-directory: labflow-backend
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build JAR artifact
        run: mvn clean package -DskipTests -q

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: labflow-backend/
          file: labflow-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-notification:
    name: 📢 Deployment Coordination
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/Produccion' && success()
    permissions:
      contents: read
      actions: write

    steps:
      - name: Trigger infrastructure deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          repository: ${{ github.repository_owner }}/labflow-infra
          event-type: deploy-backend
          client-payload: |
            {
              "backend_image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }
        continue-on-error: true

      - name: Create GitHub Release (on main)
        uses: actions/create-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
        continue-on-error: true

  vulnerability-report:
    name: 📊 Vulnerability Report
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    permissions:
      issues: write

    steps:
      - name: Download security scan artifacts
        uses: actions/download-artifact@v3
        continue-on-error: true

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sarifs = [
              'trivy-fs-results.sarif',
              'trivy-config-results.sarif',
              'semgrep.sarif',
              'dependency-check-report.sarif'
            ];
            
            let vulnCount = 0;
            for (const file of sarifs) {
              if (fs.existsSync(file)) {
                const content = JSON.parse(fs.readFileSync(file, 'utf8'));
                vulnCount += content.runs[0].results?.length || 0;
              }
            }

            if (vulnCount > 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔐 Security vulnerabilities found (${vulnCount})`,
                body: `Vulnerabilities detected in security scan. Check the [Actions](${context.payload.repository.html_url}/actions/runs/${context.runId}) tab for details.`,
                labels: ['security', 'bug']
              })
            }
