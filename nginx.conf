events {
    worker_connections 1024;
}

http {
    # Limitación de peticiones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;  # Para iniciar sesión: 5 req/min
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/m;  # General: 30 req/min
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;  # API: 60 req/min

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Deshabilitación de http2 (sugerencia de seguridad)
        http2 off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
        add_header Connection "close" always;
        
        server_tokens off;

        # Configuración de timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        # Limitar tamaño de body
        client_max_body_size 10M;

        # API endpoints con límite general
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Seguridad: descartar headers del cliente y establecer valores confiables
            # Esto previene ataques de HTTP smuggling y H2C smuggling
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # Solo IP directa, no confiar en cliente
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Protección anti-smuggling adicional
            if ($http_upgrade ~* "h2c") {
                return 421;
            }
            
            # Rechazar métodos HTTP no estándar
            if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
                return 405;
            }
        }

        # Auth endpoints con límite estricto
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            
            proxy_pass http://backend;
            
            # Seguridad: descartar headers del cliente y establecer valores confiables
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Protección anti-smuggling
            if ($http_upgrade ~* "h2c") {
                return 421;
            }
            
            # Solo permitir POST en login
            if ($request_method != POST) {
                return 405;
            }
        }

        # Swagger/OpenAPI UI (solo para desarrollo/staging)
        location /swagger-ui.html {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui/ {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (sin límite de rate)
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Todos los demás endpoints
        location / {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Seguridad: descartar headers del cliente y establecer valores confiables
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Protección anti-smuggling adicional
            if ($http_upgrade ~* "h2c") {
                return 421;
            }
            
            # Rechazar métodos HTTP no estándar
            if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
                return 405;
            }
        }
    }
}
