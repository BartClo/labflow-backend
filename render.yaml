services:
  # PostgreSQL Database
  - type: pserv
    name: labflow-db-IgnacioS
    plan: free
    region: virginia

  # Spring Boot Backend
  - type: web
    name: labflow-backend
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: labflow-db-IgnacioS
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: labflow-db-IgnacioS
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: labflow-db-IgnacioS
          property: password
      - key: SWAGGER_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
