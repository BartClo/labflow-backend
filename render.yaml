version: "1"
projects:
- name: My project
  environments:
  - name: Production
    databases:
    - name: labflow-db-IgnacioS
      databaseName: labflow_db_ignacios
      user: labflow_db_ignacios_user
      plan: free
      region: virginia
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
    services:
    - type: web
      name: labflow-backend
      runtime: docker
      region: virginia
      plan: free
      dockerfilePath: ./Dockerfile
      envVars:
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: labflow-db-IgnacioS
          property: host
      - key: DB_PORT
        fromDatabase:
          name: labflow-db-IgnacioS
          property: port
      - key: DB_NAME
        fromDatabase:
          name: labflow-db-IgnacioS
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: labflow-db-IgnacioS
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: labflow-db-IgnacioS
          property: password
      - key: SWAGGER_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
