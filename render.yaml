services:
  # PostgreSQL Database
  - type: pserv
    name: labflow-db
    env: docker
    plan: free
    region: oregon
    databases:
      - name: labflow_db
        user: labflow_user

  # Spring Boot Backend
  - type: web
    name: labflow-backend
    env: java
    region: oregon
    plan: free
    buildCommand: chmod +x ./mvnw && ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/labflow-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: labflow-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: labflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: labflow-db
          property: password
      - key: SERVER_PORT
        value: 8080
      - key: SWAGGER_ENABLED
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: SQL_LOG_LEVEL
        value: WARN
